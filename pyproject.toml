[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doggy-drawer"
version = "0.1.0"
description = "A read-only Code Puppy command inspector for herdr"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=1.0,<2"]

[project.scripts]
doggy-drawer = "doggy_drawer.__main__:main"

[project.entry-points."code_puppy.plugins"]
doggy_drawer = "doggy_drawer.register_callbacks"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1", "prompt-toolkit>=3,<4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/doggy_drawer"]
